<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINOREX - Prehistoric Survival</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <!-- HOME PAGE -->

    <section id="homeScreen" class="home-screen">

        <div class="home-content">

            <h1>DINO<span>REX</span></h1>

            <p class="game-subtitle">PREHISTORIC SURVIVAL</p>

            <p class="home-description">
                Enter the prehistoric world!
                Jump over obstacles and survive as long as you can.
            </p>

            <div class="speed-settings">

                <label for="speedSelect">SELECT GAME SPEED</label>

                <select id="speedSelect">
                    <option value="slow">SLOW</option>
                    <option value="normal" selected>NORMAL</option>
                    <option value="fast">FAST</option>
                </select>

            </div>

            <button id="startBtn">▶ PLAY</button>

            <p class="home-instruction">
                Use SPACE or the JUMP button to play
            </p>

        </div>

    </section>


    <!-- GAME SCREEN -->

    <div id="gameScreen" hidden>

        <div class="game-container">

            <h2>DINOREX</h2>

            <div class="game-area">

                <div id="dino">🦖</div>

                <div class="ground"></div>

            </div>

            <div class="score">

                <p>Time: <span id="score">0</span>s</p>

                <p>Cacti: <span id="cactusScore">0</span></p>

                <p>High Score: <span id="highScore">0</span></p>

            </div>

            <div class="game-controls">

                <p id="message">Press SPACE or tap JUMP!</p>

                <button id="pause">Pause</button>

                <button id="jumpBtn" hidden>JUMP</button>

                <button id="restart" hidden>Play Again</button>

            </div>

        </div>

    </div>


    <!-- GAME SOUNDS -->

    <audio id="jumpSound" src="jumpsound.wav"></audio>

    <audio id="levelUpSound" src="levelupsound.wav"></audio>

    <audio id="gameOverSound" src="gameoversound.wav"></audio>

    <audio id="backgroundSound" src="backgroundsound.mp3" loop></audio>

    <audio id="buttonClickSound" src="buttonclicksound.wav"></audio>


    <script src="game.js"></script>

</body>

</html>
